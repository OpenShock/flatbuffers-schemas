on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - master
      - develop
    types: [opened, reopened, synchronize]
  workflow_call:
  workflow_dispatch:

name: ci-verify

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: new

      - name: Checkout current master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          path: master

      - name: Download latest flatc g++ binary
        uses: OpenShock/actions/release-download@7e9cf5cd05af3d97a363d80adad50cfe50a273d0 # v1.0.0
        with:
          repo: google/flatbuffers
          pattern: 'Linux.flatc.binary.g++*.zip'

      - name: Compare specified .fbs files for conformity
        run: |
          # Return early if any one of the conformity checks fail
          set -e
          # Set executable flag
          chmod u+x ./flatc

          while IFS= read -r file; do
            # ignore blank lines
            [[ -z "$file" ]] && continue

            ./flatc "new/$file" --conform "master/$file"
          done < ./new/.github/workflows/verify-list
