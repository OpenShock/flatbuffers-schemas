on:
  push:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_call:
  workflow_dispatch:

name: ci-build
permissions:
  contents: read
  actions: read

env:
  DOTNET_VERSION: 10.0.x
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build solution
        run: dotnet build OpenShock.Serialization.Flatbuffers.csproj -c Release -o ./publish

      - name: Upload Nuget artifacts
        if: ${{ (github.ref_type == 'branch' && github.event_name != 'pull_request' && github.ref_name == 'master') || (github.event_name == 'workflow_dispatch' && github.ref_type == 'tag') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CSharp Artifacts
          path: |
            publish/*.nupkg
            publish/*.snupkg
            publish/*.dll
            publish/*.pdb
          retention-days: 1
          if-no-files-found: error
