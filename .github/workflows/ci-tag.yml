on:
  push:
    tags:
      - '*'
  workflow_dispatch:

name: ci-tag

env:
  DOTNET_VERSION: 10.0.x

jobs:

  publish:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET SDK ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Verify tag matches package version
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          TAG_VERSION="${TAG_NAME#v}"
          PKG_VERSION=$(grep -oPm1 '(?<=<Version>)[^<]+' OpenShock.Serialization.Flatbuffers.csproj)
          echo "Tag:     $TAG_VERSION"
          echo "Package: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match csproj <Version> ($PKG_VERSION)"
            exit 1
          fi

      - name: Pack
        run: dotnet pack OpenShock.Serialization.Flatbuffers.csproj -c Release -o ./publish

      - name: Upload Nuget artifacts
        uses: actions/upload-artifact@v7
        with:
          name: CSharp Artifacts
          path: |
            publish/*.nupkg
            publish/*.snupkg
          retention-days: 7
          if-no-files-found: error

      - name: Setup NuGet trusted publishing
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: dotnet nuget push "publish/*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
